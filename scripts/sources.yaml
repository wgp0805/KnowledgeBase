sources:
- name: 博客园
  type: rss
  url: https://www.cnblogs.com/rss.aspx
  tags:
  - 编程
  - 中文
  - 技术
  enabled: true
  max_per_source: 10
- name: 掘金-后端
  type: api
  url: https://api.juejin.cn/recommend_api/v1/article/recommend_all_feed
  method: POST
  payload:
    before: '0'
    limit: 10
    category_id: '6809637769959178254'
  data_path:
  - data
  item_path:
  - item_info
  - article_info
  title_field: title
  link_template: https://juejin.cn/post/{article_id}
  tags:
  - Java
  - 后端
  - 编程
  - 中文
  enabled: true
  max_per_source: 10
- name: 掘金-AI
  type: api
  url: https://api.juejin.cn/recommend_api/v1/article/recommend_all_feed
  method: POST
  payload:
    before: '0'
    limit: 10
    category_id: '6809637773935378440'
  data_path:
  - data
  item_path:
  - item_info
  - article_info
  title_field: title
  link_template: https://juejin.cn/post/{article_id}
  tags:
  - AI
  - LLM
  - 编程
  - 中文
  enabled: true
  max_per_source: 10
- name: 知乎探索
  type: scrape
  url: https://www.zhihu.com/explore
  selector: a[href*='/question/']
  link_prefix: https://www.zhihu.com
  tags:
  - 科技
  - 问答
  - 中文
  enabled: true
  max_per_source: 10
