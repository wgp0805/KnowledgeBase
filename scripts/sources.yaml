# ============================================================
# 知识库自动抓取 - 信息源配置
# 使用方式：直接编辑此文件，按格式增删源即可
# 修改后无需重启任何服务，下次自动抓取时生效
# ============================================================

# 信息源列表
# name:   显示名称（任意）
# type:   rss | atom | html （目前仅支持 rss/atom）
# url:    订阅地址
# tags:   标签，用于相关性过滤（留空则不过滤）
# enabled: true | false 是否启用

sources:
  # ─── AI / LLM / Agent ───
  - name: "Anthropic Blog"
    type: rss
    url: https://www.anthropic.com/feed.xml
    tags: [AI, Agent, Claude, LLM, safety]
    enabled: true

  - name: "OpenAI Blog"
    type: rss
    url: https://openai.com/blog/feed.xml
    tags: [AI, GPT, LLM, OpenAI]
    enabled: true

  - name: "Simon Willison's Blog"
    type: atom
    url: https://simonwillison.net/atom/everything/
    tags: [AI, LLM, 工具, Python, 数据]
    enabled: true

  - name: "LangChain Blog"
    type: rss
    url: https://blog.langchain.dev/feed/
    tags: [AI, Agent, RAG, LangChain, LLM]
    enabled: true

  - name: "Hugging Face Blog"
    type: rss
    url: https://huggingface.co/blog/feed.xml
    tags: [AI, LLM, 开源, 模型]
    enabled: true

  - name: "Google AI Blog"
    type: atom
    url: https://feeds.feedburner.com/blogspot/gJZg
    tags: [AI, LLM, Gemini, 研究]
    enabled: true

  # ─── Java / Spring ───
  - name: "Spring Blog"
    type: atom
    url: https://spring.io/blog.atom
    tags: [Java, Spring, SpringBoot, SpringCloud]
    enabled: true

  - name: "Baeldung"
    type: rss
    url: https://www.baeldung.com/feed
    tags: [Java, Spring, 教程, 实践]
    enabled: true

  # ─── 数据库 / 中间件 ───
  - name: "PostgreSQL Weekly"
    type: rss
    url: https://postgresweekly.com/rss/
    tags: [PostgreSQL, 数据库, SQL]
    enabled: true

  - name: "MySQL Blog"
    type: rss
    url: https://dev.mysql.com/blog/feed/
    tags: [MySQL, 数据库, SQL]
    enabled: true

  - name: "Elasticsearch Blog"
    type: rss
    url: https://www.elastic.co/blog/feed
    tags: [Elasticsearch, 搜索, 数据库]
    enabled: true

  # ─── 中文技术 ───
  - name: "知乎热榜-编程"
    type: rss
    url: https://rsshub.app/zhihu/hotlist?token=编程
    tags: [编程, 技术, 中文]
    enabled: true

  - name: "掘金-热门"
    type: rss
    url: https://rsshub.app/juejin/trending/backend
    tags: [Java, 前端, 后端, 编程]
    enabled: true

  # ─── 综合 ───
  - name: "Hacker News (AI相关)"
    type: rss
    url: https://hnrss.org/frontpage?q=AI+OR+LLM+OR+Agent+OR+GPT+OR+Claude+OR+RAG
    tags: [AI, LLM, Agent, 技术]
    enabled: true

  - name: "TLDR AI"
    type: rss
    url: https://tldr.tech/api/rss/ai
    tags: [AI, LLM, 新闻, 摘要]
    enabled: true

# ─── 过滤设置 ───
filter:
  # 相关性最低分数（0-1），低于此值将被丢弃
  min_score: 0.15
  # 每天每源最多抓取篇数
  max_per_source: 5
  # 每天总抓取上限
  max_total: 30

# ─── 存储设置 ───
storage:
  # 新文章存放目录（相对于知识库根目录）
  raw_dir: "raw/01-articles"
  # 每日摘要文件名
  digest_file: "raw/_daily_digest.md"
  # 已抓取记录（用于去重）
  seen_file: "scripts/.seen_urls.json"
